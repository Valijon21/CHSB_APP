<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d2a2e;--mut:#5b6b70;--ac:#0f4c5c;--ln:#d6d9d6;--ok:#2e7d32;--bad:#b3261e;--warn:#9a6700}

main{max-width:760px;margin:0 auto;padding:12px 14px 90px}

.card{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:14px;margin:12px 0}

<div class="mut">15 ta savol, jami 40 ball, 40 daqiqa. Har savolda bitta javob tanlang.</div>

</section>

<section id="res" class="hide card"></section>

 {b:"(B)",t:"Tasavvur qiling: radioeshittirishda musiqa qo‘yildi. Musiqaning tinglovchiga yoqimli eshitilishi qaysi effekt(lar)ga bog’liq?",o:["Fade in, Cut","Fade in, Fade out","Fade out, Trim","Trim, Cut"]},
 {b:"(B)",t:"Audio tahrirlash dasturida <b>waveform</b> nimani ifodalaydi?",o:["Tovush signalining vaqt davomida o‘zgarishini grafik ko‘rinishda","Audio faylning kompyuter xotirasidagi manzilini","Audio faylga qo‘shilgan effektlar ro‘yxatini","Faqat audioning umumiy davomiyligini"]},
 {b:"(Q)",t:"Rasmda Birds Life loyihasining <b>olti soniyalik Kirish qismi</b> tayyorlanmoqda. O‘quvchi quyidagi natijani hosil qilishi kerak:<br><img alt='Wings of Nature, Birds Life' style='max-width:100%;border-radius:6px' src='"+IMG3+"'><br>• <b>1 soniya</b> — faqat Nature rasmi;<br>• <b>keyingi 2 soniya</b> — WINGS OF NATURE;<br>• <b>oxirgi 3 soniya</b> — BIRDS LIFE.<br><b>WINGS OF NATURE</b> va <b>BIRDS LIFE</b> yozuvlari ekranga ketma-ket <b>Fade</b> orqali silliq kirib kelishi kerak. <b>Kirish</b> jami <b>6 soniya</b> davom etishi kerak. Movie Maker’da <b>Text overlay</b> alohida matnning ko‘rinish vaqtini boshqarishga imkon bermasa, ushbu natijani hosil qilish uchun qaysi amallar ketma-ketligi to‘g‘ri?",o:["Nature rasmini 6 s qilish → ikkala matnni bitta klipga Text overlay orqali qo‘shish → Fadeni faqat oxirgi matnga qo‘llash.","Nature rasmini 1 s, 2 s va 3 s davomiylikdagi uchta ketma-ket klip qilib joylashtirish → 2 s klipga WINGS OF NATURE, 3 s klipga BIRDS LIFE qo‘shish → ikkinchi va uchinchi klipga Fade transition qo‘llash.","Nature rasmini 1 s, 2 s va 3 s qilib joylashtirish → ikkala matnni 2 s klipga qo‘shish → 3 s klipni matnsiz qoldirish → barcha kliplarga Black Fade qo‘llash.","Nature rasmini 3 ta 2 soniyalik klipga ajratish → birinchi klipga WINGS OF NATURE, oxirgi klipga BIRDS LIFE qo‘shish → faqat birinchi klipga Fade qo‘llash."]},
 {b:"(Q)",t:"<b>Noma’lum qushga tegishli 1 daqiqa 20 soniyalik video</b> Movie Maker’ga yuklandi. Tayyor loyihada videoning faqat <b>dastlabki 15 soniyasi</b> ishlatilishi, u <b>1.5× tezlikda</b> namoyish etilishi va undan oldingi qush rasmi bilan video orasiga <b>2 soniyalik Cross Zoom</b> (Transition) o‘tishi qo‘yilishi kerak.<br><b>Ushbu natijani olish uchun amallar qaysi ketma-ketlikda bajariladi va video tezlashtirilgandan keyin necha soniya davom etadi?</b>",o:["Videoni 00:15 da <b>Split</b> qilish → 15 soniyadan keyingi qismini o‘chirish → qolgan videoni <b>1.5×</b> qilish → Cross Zoom = 2 s qo‘llash → video <b>10 s</b> davom etadi.","Videoni 00:15 da <b>Split</b> qilish → dastlabki 15 soniyani o‘chirish → qolgan videoni <b>1.5×</b> qilish → Cross Zoom = 2 s qo‘llash → video <b>12 s</b> davom etadi.","Videoni 00:15 da <b>Split</b> qilish → 15 soniyadan keyingi qismini o‘chirish → qolgan videoni <b>1.5×</b> qilish → Cross Zoom = 2 s qo‘llash → video <b>20 s</b> davom etadi.","Videoning dastlabki 15 soniyasini qoldirish → Cross Zoom = 2 s qo‘llash → videoni <b>1.5×</b> qilish o‘rniga davomiyligini 15 soniyadan 10 soniyaga qo‘lda o‘zgartirish → video <b>12 s</b> davom etadi."]},
 {b:"(Q)",t:"Birds Life loyihasida fon musiqasi Music trackda ijro etilmoqda. Inca ternning dengiz bo‘yidagi videosi boshlanganda <b>dengiz shovqini asta-sekin kuchayib</b>, video davomida eshitilishi kerak. Dengiz shovqini fon musiqasini bosib ketmasligi uchun uning eng yuqori ovoz darajasi <b>0.6</b> bo‘lishi kerak.<br><b>Rasmdagi audio treklarni shu natijaga mos sozlash uchun qaysi amallar bajariladi?</b>",o:["Music trackni tanlash → Volume = 0.6 → Fade-out → dengiz shovqinini o‘zgartirmaslik.","Dengiz shovqini joylashgan Voice track qismini tanlash → Effect → Fade-out → Volume = 0.6 → loyiha oxirida ovozni silliq tugatish uchun Fade-in qo‘llash.","Dengiz shovqini joylashgan Voice track qismini tanlash → Effect → Fade-in → Volume = 0.6 → loyiha oxirida ovozni silliq tugatish uchun Fade-out qo‘llash.","Music track va Voice trackni bir xil ovoz darajasiga keltirish → ikkala trekka Fade-in qo‘llash → Volume = 1."]},
 {b:"(B)",t:"Videofayl tahrirlangach, o‘quvchi uni hajmi kichikroq bo‘lib, sifatini yaxshi saqlaydigan keng tarqalgan formatda saqlamoqchi. Qaysi format mos?",o:["WAV","MP4","DOCX","BMP"]},
 {b:"(Q)",t:"Rasmda Audacity dasturining boshqaruv panelidagi <b>4 ta ikonka</b> 1–4 bilan belgilangan. Ikonkalarni ularning vazifalari bilan moslashtiring.<br><span style='font-size:1.5rem'>1. ▶&nbsp;&nbsp; 2. ●&nbsp;&nbsp; 3. ■&nbsp;&nbsp; 4. ⏸</span><br>Vazifalar:<br>a) Audio ijrosini vaqtincha to‘xtatib turish<br>b) Audioni ijro etish<br>c) Ovoz yozishni boshlash<br>d) Audio ijrosi yoki yozishni to‘liq to‘xtatish<br>Qaysi javobda moslik to‘g‘ri?",o:["1–b, 2–c, 3–d, 4–a","1–c, 2–b, 3–a, 4–d","1–b, 2–d, 3–c, 4–a","1–a, 2–c, 3–b, 4–d"]},
 {b:"(Q)",t:"<b>Audacity</b> dasturida ikki xil audio trek quyidagi rasmdagidek davomiylikka ega:<br>1) <img alt='1-trek nature_narration' style='max-width:48%' src='"+IMG8A+"'> 2) <img alt='2-trek Sound of Winterfell' style='max-width:48%' src='"+IMG8B+"'><br><b>1-trek oxiridan 3 soniya</b>, <b>2-trek boshidan esa 2 soniya</b> kesish va keraksiz qismlar olib tashlangach, ikkala klip <b>uzilish sezilmaydigan qilib ketma-ket</b> eshitilishi kerak. Qaysi amallar ketma-ketligi eng to‘g‘ri ekanini aniqlang?",o:["1-klipning oxirgi 3 s qismini belgilash → <b>Delete</b> → 2-klipning dastlabki 2 s qismini belgilash → <b>Delete</b> → kliplarni ketma-ket joylashtirish → <b>1-klip oxiriga Fade Out, 2-klip boshiga Fade In qo‘llash</b>.","1-klipning oxirgi 3 s qismini o‘chirish → 2-klipning boshidagi 2 s qismini o‘chirish → kliplarni alohida eksport qilish.","1-klipning oxirgi 3 s qismini belgilash → <b>Fade in</b> → 2-klipning dastlabki 2 s qismini belgilash → <b>Fade out</b> → ikkala klipni o‘chirmasdan birlashtirish.","Ikkala klipni avval birlashtirish → har ikki audio trekning tutashgan qismidagi umumiy 5 soniyasini <b>Delete</b> qilish → <b>Volume</b>ni oshirish."]},
 {b:"(Q)",t:"Jadvalda Movie Maker dasturidagi <b>4 ta buyruq ikonkalari vazifalari</b> bilan berilgan. Ikonkalarni ularning vazifalari bilan moslashtiring."+T9,o:["1–b, 2–d, 3–a, 4–c","1–a, 2–b, 3–c, 4–d","1–b, 2–d, 3–c, 4–a","1–d, 2–b, 3–a, 4–c"]},
 {b:"(Q)",t:"Audacityda sempl olish chastotasi <b>40 kHz</b> bo‘lgan <b>10 soniyalik</b> audio yozildi. Audioning <b>oxirgi</b> va <b>boshidagi 2 soniyasi</b> kesib tashlandi. Qolgan audio qismida jami nechta sempl mavjud?",o:["400 000","80 000","240 000","160 000"]},
 {b:"(Q)",t:"Audacityda 30 soniyalik ikkita bir xil audioklip mavjud.<br>• 1-klip 1,5x tezlashtirildi.<br>• 2-klip 2x sekinlashtirildi.<br>O‘zgarishlardan keyin kliplarning davomiyligi va ovozning eshitilish holati qaysi javobda to‘g‘ri ko‘rsatilgan?",o:["1-klip — 20 s, ovoz balandroq va chiyillagan; 2-klip — 60 s, ovoz chuqurroq va bas ko‘proq","1-klip — 45 s, ovoz chuqurroq va bas ko‘proq; 2-klip — 15 s, ovoz balandroq va chiyillagan","1-klip — 20 s, ovoz chuqurroq va bas ko‘proq; 2-klip — 60 s, ovoz balandroq va chiyillagan","1-klip — 45 s, ovoz balandroq va chiyillagan; 2-klip — 15 s, ovoz chuqurroq va bas ko‘proq"]},
 {b:"(Q)",t:"Rasmda “Birds Life” loyihasidagi videoklipning tahrirlashdan oldingi va keyingi holati ko‘rsatiladi. <b>1-screen:</b> videoklip — 00:00–00:30; <b>2-screen:</b> Split video — 00:18 nuqtada; <b>3-screen:</b> qolgan 18 soniyalik qism uchun Speed = 1.5x; <b>4-screen:</b> keyingi klip bilan Transition o‘rnatilgan. O‘quvchi videoning <b>18-soniyasidan keyingi qismini olib tashlab</b>, qolgan qismni <b>1.5× tezlashtirishi</b> va undan keyingi klipga o‘tish effektini qo‘llashi kerak.<br>Qaysi amallar ketma-ketligi va yakuniy natija to‘g‘ri?",o:["Split 00:18 → ikkala qismni saqlash → butun videoni 1.5× tezlashtirish → Transition qo‘llash → 20 s","Split 00:18 → birinchi qismni o‘chirish → qolgan klipni 1.5× tezlashtirish → Transition qo‘llash → 8 s","Split 00:18 → ikkinchi qismni o‘chirish → qolgan klipni 1.5× sekinlashtirish → Transition qo‘llash → 27 s","Split 00:18 → ikkinchi qismni o‘chirish → qolgan klipni 1.5× tezlashtirish → Transition qo‘llash → 12 s"]},
 {b:"(Q)",t:"“Birds Life” loyihasining Inca tern qismi ajratib ko‘rsatilgan.<br><img alt='Video track, Music track, Voice track' style='max-width:100%;border-radius:6px' src='"+IMG13+"'><br>Rasm va video joylangan bu videoklipda bir vaqtda musiqa va dengiz shovqini joylashtirilgan. Screenlardan foydalanib, quyidagi natijaga erishish uchun bajarilgan amallarni aniqlang:<br><b>Fon musiqasi uzluksiz ijro etiladi. Inca tern videosi boshlanganda dengiz shovqini asta-sekin eshitila boshlaydi, fon musiqasini to‘liq bosib ketmaydi va video oxirida asta-sekin yo‘qoladi.</b><br>Qaysi sozlamalar ushbu natijani beradi?",o:["Voice track — fon musiqasi; Music track — dengiz shovqini → Volume 1.0 → Fade-in","Music track — fon musiqasi; Voice track — dengiz shovqini → Fade-in → Volume 0.6 → Fade-out","Ikkala audio Music trackka joylashtiriladi → dengiz shovqiniga Volume 1.0 → Fade-out","Dengiz shovqini Voice trackka joylashtiriladi → Volume 0.6; Fade-in va Fade-out qo‘llanmaydi"]},
 {b:"(M)",t:"“Birds Life” loyihasida videoklip <b>18 s</b>. O‘quvchi uni <b>12-soniyadan Split</b> qilib, oxirgi qismini o‘chirdi va qolgan videoni <b>1.5× Speed</b> bilan tezlashtirdi. Natijada video <b>8 s</b> bo‘ldi.<br>Lekin soundtrack tahrirlanmadi va <b>12 s</b> davom etmoqda. Natijada tasvir tugagandan keyin ham ovoz yana <b>4 s</b> davom etmoqda.<br>Videoklip va soundtrack <b>bir vaqtda tugashi</b>, ovoz esa keskin uzilmasligi kerak. Qaysi yechim to‘g‘ri?",o:["Videoni 12 s holatiga qaytarish → soundtrackni o‘zgartirmaslik → Fade-in","Soundtrackning oxirgi 4 s qismini olib tashlash → qolgan audio oxiriga Fade-out qo‘llash → video va audioni 8 s nuqtada yakunlash","Soundtrackni 1.5× tezlashtirish → videoni 12 s qilish → Fade-in","Soundtrackni 12 s qoldirish → videoga Transition qo‘llash → ovozni Volume 0.6 qilish"]},
 {b:"(M)",t:"O‘quvchi 30 soniyalik video tayyorladi va unga 45 soniyalik audio joylashtirdi. Natijada audio video tugaganidan keyin yana 15 soniya davom etdi. Shuningdek, audioning dastlabki 5 soniyasida ovoz balandligi videoga nisbatan juda yuqori ekanligi aniqlandi.<br>O‘quvchi audio va videoni bir vaqtda tugatishi hamda audio boshlanishini silliq va mos ovoz balandligida ijro ettirishi kerak.<br>Ushbu ikki muammoni bir vaqtda bartaraf etish uchun qaysi tahrirlash amallari eng to‘g‘ri tanlangan?",o:["Audioni <b>1.5x Speed</b> bilan tezlashtirish → 30 s ga keltirish → dastlabki qismiga <b>Fade-out</b> qo‘llash","Audioning dastlabki 15 s qismini <b>Trim</b> qilish → oxirgi qismiga <b>Fade-out</b> qo‘llash → <b>Volume</b>ni oshirish","Videoni 45 s gacha uzaytirish → audioning dastlabki 5 s qismini o‘chirish → <b>Fade-out</b> qo‘llash","Audioning oxirgi 15 s qismini <b>Trim</b> qilish → dastlabki qismiga <b>Fade-in</b> qo‘llash → <b>Volume</b>ni mos darajaga kamaytirish"]}
];
const L = ["A","B","C","D"];
const $ = id => document.getElementById(id);
let S = null, tick = null;

const load = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render() {
  $("start").classList.add("hide"); $("test").classList.remove("hide");
  $("qs").innerHTML = Q.map((q, i) => '<div class="card q"><b class="n">' + (i+1) + '.' + q.b + '</b> ' + q.t + '<div>' +
    q.o.map((o, j) => '<label class="opt"><input type="radio" name="q' + (i+1) + '" value="' + L[j] + '"' + (S.a[i+1] === L[j] ? ' checked' : '') + '><span><b>' + L[j] + ')</b> ' + o + '</span></label>').join('') + '</div></div>').join('');
  $("qs").onchange = e => { if (e.target.name) { S.a[e.target.name.slice(1)] = e.target.value; save(); prog(); } };
  prog(); clearInterval(tick); tick = setInterval(clock, 1000); clock();
}
const prog = () => $("prog").textContent = "Javob berildi: " + Object.keys(S.a).length + " / " + Q.length;
function clock() {
  const left = TOTAL_SEC - Math.floor((Date.now() - S.t0) / 1000);
  $("timer").textContent = Math.floor(Math.max(left,0)/60) + ":" + String(Math.max(left,0)%60).padStart(2,"0");
  $("timer").className = left < 300 ? "low" : "";
  if (left <= 0) { clearInterval(tick); send(); }
}
function payload() { return { fam: S.p.fam, ism: S.p.ism, maktab: S.p.maktab, sinf: S.p.sinf, sec: Math.min(Math.floor((S.end - S.t0)/1000), 86400), javob: S.a }; }

async function send() {
  if (!API_URL) { $("msg").textContent = "API_URL o'rnatilmagan (index.html boshida)."; return; }
  if (!S.end) { S.end = Date.now(); save(); }
  $("send").disabled = true; $("retry").classList.add("hide"); $("msg").textContent = "Yuborilmoqda...";
  try {
    const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload()) });
    const d = await r.json();
    if (!d.ok) { $("msg").textContent = d.xato || "Xato"; $("send").disabled = false; if (!d.dublikat) $("retry").classList.remove("hide"); return; }
    clearInterval(tick); localStorage.removeItem(KEY); showRes(d);
  } catch (e) {
    $("msg").textContent = "Internet yo'q. Javoblaringiz saqlandi.";
    $("send").disabled = false; $("retry").classList.remove("hide");
  }
}
function showRes(d) {
  $("test").classList.add("hide"); $("res").classList.remove("hide");
  const note = d.holat !== "OK" ? '<p style="color:var(--warn)">Bu natija o‘qituvchi tomonidan tekshiriladi, ball o‘zgarishi mumkin.</p>' : "";
  $("res").innerHTML = "<h1>Taxminiy natija: " + d.jami + " / " + d.max + " ball. Baho: " + d.baho + "</h1>" + note +
    d.items.map(x => '<div class="r"><span>' + x.n + '-band</span><span style="color:var(' + (x.ball ? '--ok' : '--bad') + ')">' + (x.ball ? "to‘liq, " + x.ball + " ball" : "0 ball") + "</span></div>").join("") +
    '<p class="mut">To‘g‘ri javoblar ko‘rsatilmaydi. Yakuniy ball o‘qituvchi tasdiqlagandan keyin belgilanadi.</p><button id="new">Yangi o‘quvchi uchun boshlash</button>';
  $("new").onclick = () => location.reload();
}

$("go").onclick = () => {
  const p = { fam: $("fam").value.trim(), ism: $("ism").value.trim(), maktab: $("maktab").value.trim(), sinf: $("sinf").value.trim() };
  if (Object.values(p).some(v => !v)) { $("err").textContent = "Barcha maydonlarni to'ldiring."; return; }
  S = { p, a: {}, t0: Date.now() }; save(); render();
};
$("send").onclick = () => { const n = Q.length - Object.keys(S.a).length; if (n && !confirm(n + " ta savolga javob berilmagan. Yuborilsinmi?")) return; send(); };
$("retry").onclick = send;
S = load(); if (S && S.p) render();
</script>
</body>
</html>
