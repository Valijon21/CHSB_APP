# Local setup:   docker compose up --build        (database + application on :8000)
# Database only: docker compose up -d postgres    (for development and tests)
services:
  postgres:
    image: postgres:16-alpine
    container_name: chsb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: chsb_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chsb_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: chsb_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/chsb_db"
      JWT_SECRET: "${JWT_SECRET:-}"
      SEED_PASSWORD: "${SEED_PASSWORD:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
