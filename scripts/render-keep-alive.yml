name: Render Server Keep-Alive

on:
  schedule:
    # Har 14 daqiqada Render serverga ping berib turadi (Render 15 daqiqada uxlaydi)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Istalgan vaqtda GitHub Actions orqali qo'lda ishga tushirish

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        env:
          TARGET_URL: ${{ secrets.RENDER_APP_URL || 'https://chsb-app.onrender.com' }}
        run: |
          echo "Pinging ${TARGET_URL}/health ..."
          curl -s -f -m 30 "${TARGET_URL}/health" || echo "Ping yuborildi, server uyg'onmoqda"
